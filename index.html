<html>
	<head>
		<link rel="stylesheet" href="styles.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	</head>
	<body>
		<div id="main">
			<div id="primary">
				<div id="txtScreen"></div>
				<div id="commandArea">
					<textarea id="commandLine" placeholder="Enter command..."></textarea>
				</div>
			</div>
			<div id="panel"></div>
		</div>
		<script>
			var version = {
				color: "artifact",
				text: "12:45",
			}
			var FittedPlateMail = {
				color: "superior",
				text: "Fitted Plate Mail",
			}
			function postText(a,b) {
				if(!b) {
					$('#txtScreen').append('<span class="' + a.color + '">' + a.text + '</span></br>');
				} else {
					$('#txtScreen').append('<span class="uncommon">' + a + '</span></br>');
				}
			}
			$(function() {
				postText(version);
				postText(FittedPlateMail);
			})
			//commands
			var spawn = {
				entity: "",
				quantity: 1,
				execute: postText(spawn.entity,1), //should append current room with mob
			}
			var heal = {
				execute: postText("You are healed",1),
			}
			$("#commandLine").keypress(function (e) {
				if(e.which === 13 && !e.shiftKey) { //includes option to ignore if SHIFT is held
					e.preventDefault();
					t = $("#commandLine").val();
					console.log(t.substring(0,1));
					if(t.substring(0,1) != "/") {
						postText(t,1);
						$("#commandLine").val('');
					} else {
						//
						command(t);
					}
				}
			});
			function command(c) {
				c = c.substring(1,t.length);
				console.log(c);
				if(c.indexOf(" ") != 0) {
					code = c.substring(1,t.indexOf(" "));
				} else {
					code = c;
				}
				code.execute;
				console.log(command);
			}
		</script>
	</body>
</html>
