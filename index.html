<html>
	<head>
		<link rel="stylesheet" href="styles.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	</head>
	<body>
		<div id="main">
			<div id="primary">
				<div id="txtScreen"></div>
				<div id="commandArea">
					<textarea id="commandLine" placeholder="Enter command..."></textarea>
				</div>
			</div>
			<div id="panel"></div>
		</div>
		<script>
			//$("body").css("background-image", "url=/images/viking1.jpg");
			var FittedPlateMail = {
				color: "superior",
				text: "Fitted Plate Mail",
			}
			function postText(a) {
				$('#txtScreen').append('<span class="' + a.color + '">' + a.text + '</span>');
			}
			$(function() {
				postText(FittedPlateMail);
			})
		</script>
	</body>
</html>
